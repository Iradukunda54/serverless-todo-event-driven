<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do Tasks</title>
  </head>
  <body>
    <header class="topbar">
      <h1>To-Do Tasks</h1>
      <div id="session" class="session" hidden>
        <span id="user-email"></span>
        <button id="sign-out" class="link">Sign out</button>
      </div>
    </header>

    <main>
      <div id="banner" class="banner" hidden></div>

      <!-- Authentication -->
      <section id="auth-view" class="card auth" hidden>
        <div class="tabs">
          <button class="tab active" data-mode="signin">Sign in</button>
          <button class="tab" data-mode="signup">Sign up</button>
        </div>
        <form id="auth-form">
          <label>Email <input id="auth-email" type="email" autocomplete="email" required /></label>
          <label>Password
            <input id="auth-password" type="password" autocomplete="current-password" minlength="8" required />
          </label>
          <p class="hint" id="password-hint" hidden>At least 8 characters, with upper-case, lower-case and a number.</p>
          <button type="submit" id="auth-submit" class="primary">Sign in</button>
        </form>
        <p class="hint">After your first sign-in you will receive an "AWS Notification - Subscription Confirmation"
          email. Confirm it to receive task-expiry notifications.</p>
      </section>

      <!-- Tasks -->
      <section id="tasks-view" hidden>
        <form id="create-form" class="card create">
          <h2>New task</h2>
          <label class="grow">Description <input id="new-description" maxlength="500" required /></label>
          <label>Date <input id="new-date" type="date" required /></label>
          <label>Expires in
            <select id="new-deadline">
              <option value="">5 minutes (default)</option>
              <option value="1">1 minute</option>
              <option value="2">2 minutes</option>
              <option value="10">10 minutes</option>
              <option value="60">1 hour</option>
              <option value="1440">1 day</option>
            </select>
          </label>
          <button type="submit" class="primary">Add task</button>
        </form>

        <div class="toolbar">
          <span id="last-refresh" class="hint"></span>
          <button id="refresh" class="link">Refresh</button>
        </div>

        <div class="columns">
          <div class="column" data-status="Pending"><h2>Pending <span class="count"></span></h2><ul></ul></div>
          <div class="column" data-status="Completed"><h2>Completed <span class="count"></span></h2><ul></ul></div>
          <div class="column" data-status="Expired"><h2>Expired <span class="count"></span></h2><ul></ul></div>
        </div>
      </section>
    </main>

    <template id="task-template">
      <li class="task">
        <div class="task-main">
          <p class="description"></p>
          <p class="meta"></p>
        </div>
        <div class="actions">
          <button class="complete">Complete</button>
          <button class="edit">Edit</button>
          <button class="delete danger">Delete</button>
        </div>
      </li>
    </template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

name: Backend - SAM pipeline

# Tests, builds and deploys the SAM application in backend/ using the
# pipeline resources created by `sam pipeline bootstrap --stage dev`.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-pipeline.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> AWS
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  PIPELINE_EXECUTION_ROLE: ${{ vars.PIPELINE_EXECUTION_ROLE }}
  CLOUDFORMATION_EXECUTION_ROLE: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE }}
  ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -v
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Validate and lint template
        run: sam validate --lint --region ${AWS_REGION}

  deploy:
    needs: test
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PIPELINE_EXECUTION_ROLE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build
        run: sam build

      - name: Assume pipeline execution role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          role-session-name: backend-deployment
          role-duration-seconds: 3600

      - name: Deploy
        run: |
          sam deploy \
            --config-env dev \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --s3-bucket ${ARTIFACTS_BUCKET} \
            --s3-prefix serverless-todo-dev \
            --role-arn ${CLOUDFORMATION_EXECUTION_ROLE} \
            --region ${AWS_REGION}

      - name: Stack outputs
        run: |
          aws cloudformation describe-stacks --stack-name serverless-todo-dev \
            --query "Stacks[0].Outputs" --output table

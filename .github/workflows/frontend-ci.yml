name: Frontend - build check

# Hosting and deployment are done by AWS Amplify (it builds frontend/ on every
# push to main). This workflow only checks that the frontend still builds.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_AWS_REGION: eu-west-1
          VITE_API_URL: https://example.execute-api.eu-west-1.amazonaws.com/dev
          VITE_USER_POOL_ID: eu-west-1_example
          VITE_USER_POOL_CLIENT_ID: example
